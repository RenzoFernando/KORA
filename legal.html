<!doctype html>

<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>KORΛ · Legal</title>

    <link rel="icon" href="branding/09_favicon_web.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script>
      try {
        const raw = localStorage.getItem('kora-corte3-state');
        const state = raw ? JSON.parse(raw) : null;
        document.documentElement.dataset.theme = state?.theme === 'dark' ? 'dark' : 'light';
      } catch (error) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>

    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body class="legal-body">
    <main class="legal-shell">
      <header class="legal-top">
        <a href="index.html" class="brand-block" aria-label="KORΛ, volver a la aplicación"
          ><span class="brand-logo-pair" aria-hidden="true"
            ><img
              class="brand-logo-on-light"
              src="branding/10_logotipo_korlambda_oscuro.svg"
              alt="" /><img
              class="brand-logo-on-dark"
              src="branding/11_logotipo_korlambda_claro.svg"
              alt="" /></span
          ><span>Legal</span></a
        >

        <nav class="legal-tabs" data-legal-tabs></nav>
      </header>

      <article class="legal-document" data-legal-document></article>
    </main>

    <script src="js/data.js"></script>

    <script src="js/legal.js"></script>
  </body>
</html>
